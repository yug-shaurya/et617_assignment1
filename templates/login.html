<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-shell">
        <div class="panel auth-panel">
            <div class="brand-block centered-brand">
                <div class="brand-mark">🎓</div>
                <div>
                    <p class="eyebrow">Student learning portal</p>
                    <h1>StudyFlow</h1>
                </div>
            </div>

            <p class="subtext">Sign in to continue your personalized learning journey and track every chapter progress.</p>
            {% if error %}<p class="error">{{ error }}</p>{% endif %}

            <form method="post" action="{{ url_for('login') }}">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="learner" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="demo123" required>

                <button type="submit">Log in</button>
            </form>

            <div class="auth-links">
                <a href="#">Forgot password?</a>
                <a href="#">Help</a>
            </div>

            <div class="register-box">
                <h2>Create a learner account</h2>
                <form method="post" action="{{ url_for('register') }}">
                    <label for="new-username">New Username</label>
                    <input type="text" id="new-username" name="username" placeholder="new learner" required>

                    <label for="new-password">Password</label>
                    <input type="password" id="new-password" name="password" placeholder="Choose a password" required>

                    <button type="submit" class="secondary">Register</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
